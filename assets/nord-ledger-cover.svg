<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="710" viewBox="0 0 1440 710" role="img" aria-labelledby="title desc">
  <title id="title">Nord Ledger, digital banking demo and design system</title>
  <desc id="desc">Deep forest-green branded illustration with a banking dashboard composition, balance, spending activity, and a fictional debit card. This is an illustrative graphic, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a2725"/><stop offset=".56" stop-color="#153d34"/><stop offset="1" stop-color="#0c2727"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#205a47"/><stop offset=".52" stop-color="#123e35"/><stop offset="1" stop-color="#072621"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8f998"/><stop offset="1" stop-color="#8ad2a7"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#ecf2eb"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#95baa6" opacity=".16"/></pattern>
    <filter id="shadow" x="-40%" y="-40%" width="200%" height="200%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#001510" flood-opacity=".36"/></filter>
    <clipPath id="clip"><rect width="1440" height="710" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
