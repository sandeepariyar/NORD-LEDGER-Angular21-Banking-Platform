          <text x="403" y="0" font-size="11" font-weight="700" fill="#517c63">VIEW ALL</text>
          <circle cx="18" cy="45" r="18" fill="#e0ece2"/><text x="11" y="51" font-size="16" fill="#285b43">◈</text>
          <text x="49" y="41" font-size="13" font-weight="650" fill="#244438">Koru Market</text><text x="49" y="57" font-size="11" fill="#8c9c90">Groceries · Today</text>
          <text x="447" y="48" font-size="14" font-weight="700" fill="#214136">−€86.40</text>
          <line x1="0" x2="506" y1="74" y2="74" stroke="#e0e6de"/>
          <circle cx="18" cy="105" r="18" fill="#e0ece2"/><text x="11" y="110" font-size="16" fill="#285b43">✦</text>
          <text x="49" y="100" font-size="13" font-weight="650" fill="#244438">Northstar Studio</text><text x="49" y="116" font-size="11" fill="#8c9c90">Salary · Yesterday</text>
          <text x="436" y="107" font-size="14" font-weight="700" fill="#3d9268">+€4,850</text>
        </g>
