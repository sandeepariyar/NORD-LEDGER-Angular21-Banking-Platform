    <rect width="1440" height="710" fill="url(#dots)"/>
    <circle cx="1140" cy="175" r="400" fill="none" stroke="#a5ddb9" stroke-opacity=".09" stroke-width="1"/>
    <circle cx="1140" cy="175" r="310" fill="none" stroke="#a5ddb9" stroke-opacity=".09" stroke-width="1"/>
    <circle cx="1140" cy="175" r="218" fill="none" stroke="#a5ddb9" stroke-opacity=".09" stroke-width="1"/>
    <path d="M0 592 Q420 510 850 650 T1440 560" fill="none" stroke="#a2e9b7" stroke-opacity=".12" stroke-width="2"/>

    <g font-family="Segoe UI, Arial, sans-serif">
      <g transform="translate(78 62)">
        <rect width="54" height="54" rx="16" fill="#c8f998"/>
        <text x="13" y="39" font-size="41" font-weight="700" fill="#10332d">n</text>
        <circle cx="42" cy="40" r="4" fill="#10332d"/>
        <text x="72" y="24" font-size="25" font-weight="700" letter-spacing="-.5" fill="#f3faf1">nord ledger</text>
        <text x="73" y="47" font-size="11" font-weight="600" letter-spacing="3.1" fill="#a9c6b3">DIGITAL BANKING / CONCEPT</text>
      </g>
      <rect x="78" y="181" width="157" height="32" rx="16" fill="#254e40" stroke="#4a8063" stroke-width="1"/>
      <circle cx="97" cy="197" r="4" fill="#c8f998"/>
      <text x="109" y="202" font-size="11" font-weight="700" letter-spacing="1.8" fill="#d1eac9">INTERACTIVE DEMO</text>

      <text x="74" y="290" font-family="Georgia, serif" font-size="71" letter-spacing="-2" fill="#f4f6f2">Money, with</text>
      <text x="74" y="368" font-family="Georgia, serif" font-size="73" font-style="italic" letter-spacing="-2" fill="#c8f998">clarity.</text>
      <text x="78" y="422" font-size="20" fill="#bfd1c5">An expressive Nordic banking experience,</text>
      <text x="78" y="452" font-size="20" fill="#bfd1c5">engineered from the interface to the API.</text>

      <g transform="translate(78 500)">
        <rect width="182" height="52" rx="16" fill="#c8f998"/>
