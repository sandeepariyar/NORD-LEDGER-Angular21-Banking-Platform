          <rect x="88" y="86" width="18" height="33" rx="4" fill="#9dc1a6"/>
          <rect x="120" y="67" width="18" height="52" rx="4" fill="#215b44"/>
          <rect x="152" y="89" width="18" height="30" rx="4" fill="#9dc1a6"/>
        </g>
        <g transform="translate(28 325)">
