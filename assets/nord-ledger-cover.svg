        <text x="222" y="33" font-size="16" font-weight="600" fill="#e4eee7">REST API</text>
        <rect x="362" width="176" height="52" rx="16" fill="none" stroke="#6c9380"/>
        <text x="383" y="33" font-size="16" font-weight="600" fill="#e4eee7">Design system</text>
      </g>
