        <path d="M0 112 Q120 30 273 95" fill="none" stroke="#84cba1" stroke-opacity=".32" stroke-width="22"/>
        <path d="M0 125 Q120 42 273 107" fill="none" stroke="#c8f998" stroke-opacity=".3" stroke-width="1.5"/>
