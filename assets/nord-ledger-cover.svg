        <circle cx="238" cy="24" r="10" fill="#bfe987" opacity=".8"/><circle cx="249" cy="24" r="10" fill="#8ed4a0" opacity=".65"/>
        <rect x="22" y="59" width="34" height="25" rx="5" fill="#d0d4aa"/>
        <path d="M36 59 V84 M22 71 H56" stroke="#8a9673"/>
        <text x="21" y="113" font-size="14" letter-spacing="2.1" fill="#f6fbf4">••••  ••••  ••••  4829</text>
        <text x="21" y="142" font-size="8" font-weight="700" letter-spacing="1.2" fill="#b4d0ba">CARD HOLDER</text><text x="21" y="156" font-size="11" font-weight="700" fill="#fff">ALEX MORGAN</text>
